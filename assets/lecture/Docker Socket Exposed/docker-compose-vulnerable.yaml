services:
  # VULNERABLE: IT Troubleshooting container with dangerous privileges
  # 🚨 This simulates a "convenience" container for IT admins to troubleshoot
  # Common pattern: Give IT "full access" for easier troubleshooting = security disaster
  it-troubleshooting:
    image: alpine:latest
    container_name: it-troubleshoot-vulnerable
    
    # 🚨 SECURITY VULNERABILITY: Running as root for "admin convenience"
    user: "0:0"  # root:root - "IT needs full access"
    
    # 🚨 SECURITY VULNERABILITY: Mount everything for "complete visibility"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro  
      - /:/rootfs:ro,rslave
      # 🚨 CRITICAL VULNERABILITY: Docker socket for "container management"
      - /var/run/docker.sock:/var/run/docker.sock
    
    # Install troubleshooting tools that IT "needs"
    command: |
      sh -c "
      apk add --no-cache curl wget htop procps net-tools &&
      echo 'IT Troubleshooting container ready - Full admin access!' &&
      tail -f /dev/null
      "
    
    restart: unless-stopped
    
    labels:
      - "purpose=it-troubleshooting"
      - "team=infrastructure"
      - "vulnerability=excessive-privileges"

  # VULNERABLE: Node Exporter with Docker socket access
  # 🚨 This demonstrates the WRONG way - giving monitoring tools Docker socket access
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-vulnerable

    # ✅ These mounts are legitimate and needed for monitoring
    # /proc - Process and system information
    # /sys - System device and kernel information  
    # / - Root filesystem (read-only) for disk usage metrics
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      # 🚨 SECURITY VULNERABILITY: Docker socket mount
      # This is UNNECESSARY for monitoring but creates massive security hole
      - /var/run/docker.sock:/var/run/docker.sock
    
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    
    ports:
      - "9100:9100"
    
    restart: unless-stopped
    
    labels:
      - "purpose=system-monitoring"
      - "vulnerability=docker-socket-exposed"

  # Prometheus: Collects metrics from Node Exporter
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-vulnerable
    
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    
    volumes:
      - ./prometheus-config:/etc/prometheus
      # 🚨 SECURITY VULNERABILITY: Docker socket mount
      # Prometheus doesn't need this but "admin convenience" adds it
      - /var/run/docker.sock:/var/run/docker.sock
    
    ports:
      - "9090:9090"
    
    depends_on:
      - node-exporter
    
    restart: unless-stopped
    
    labels:
      - "purpose=metrics-collection"
      - "vulnerability=docker-socket-exposed"

  # Grafana: Visualizes the metrics  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-vulnerable
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    
    ports:
      - "3000:3000"
    
    depends_on:
      - prometheus
    
    restart: unless-stopped
    
    labels:
      - "purpose=metrics-visualization"

