services:
  # SECURE: Node Exporter for system monitoring
  # Demonstrates legitimate need for /proc and /sys access WITHOUT Docker socket
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter

    # ✅ SECURE: Only the minimal filesystem access needed for monitoring
    # /proc - Process and system information
    # /sys - System device and kernel information
    # / - Root filesystem (read-only) for disk usage metrics
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

    ports:
      - "9100:9100"

    restart: unless-stopped

    labels:
      - "purpose=system-monitoring"
      - "security=minimal-privileges"

  # Prometheus: Collects metrics from Node Exporter
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    # Embedded configuration via command line
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"

    # Create minimal prometheus config via volume mount
    volumes:
      - ./prometheus-config:/etc/prometheus

    ports:
      - "9090:9090"

    depends_on:
      - node-exporter

    restart: unless-stopped

    labels:
      - "purpose=metrics-collection"

  # Grafana: Visualizes the metrics
  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    restart: unless-stopped

    labels:
      - "purpose=metrics-visualization"
