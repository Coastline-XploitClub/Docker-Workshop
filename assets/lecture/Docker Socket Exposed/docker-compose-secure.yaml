services:
  # SECURE: IT Troubleshooting container with minimal privileges
  # ✅ This shows how to provide IT troubleshooting access WITHOUT security risks
  it-troubleshooting:
    image: ubuntu:latest
    container_name: it-troubleshoot-secure

    # ✅ SECURE: Run as non-root user with minimal privileges
    user: "1000:1000" # non-privileged user

    # ✅ SECURE: Only mount what's actually needed for troubleshooting
    volumes:
      # Read-only access to container logs (not host logs)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # NO Docker socket mount - use 'docker exec' from host instead
      # NO host filesystem mount - troubleshoot via container tools only
      # NO /proc or /sys mounts - use container's own namespace

    # Install same troubleshooting tools but with limited access
    command: |
      bash -c "
      apt-get update &&
      apt-get install -y curl wget htop procps net-tools &&
      echo 'IT Troubleshooting container ready - Secure limited access' &&
      echo 'Use: docker exec -it <container> <command> from host for container access' &&
      tail -f /dev/null
      "

    restart: unless-stopped

    # ✅ SECURE: Additional container hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

    labels:
      - "purpose=it-troubleshooting"
      - "team=infrastructure"
      - "security=hardened"

  # SECURE: Node Exporter for system monitoring
  # Demonstrates legitimate need for /proc and /sys access WITHOUT Docker socket
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter

    # ✅ SECURE: Only the minimal filesystem access needed for monitoring
    # /proc - Process and system information
    # /sys - System device and kernel information
    # / - Root filesystem (read-only) for disk usage metrics
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

    ports:
      - "9100:9100"

    restart: unless-stopped

    labels:
      - "purpose=system-monitoring"
      - "security=minimal-privileges"

  # Prometheus: Collects metrics from Node Exporter
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    # Embedded configuration via command line
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"

    # Create minimal prometheus config via volume mount
    volumes:
      - ./prometheus-config:/etc/prometheus

    ports:
      - "9090:9090"

    depends_on:
      - node-exporter

    restart: unless-stopped

    labels:
      - "purpose=metrics-collection"

  # Grafana: Visualizes the metrics
  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    restart: unless-stopped

    labels:
      - "purpose=metrics-visualization"
