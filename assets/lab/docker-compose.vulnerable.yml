version: '3.8'
services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.vulnerable
    image: vulnerable-app:latest
    privileged: true
    network_mode: host
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - ALL
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      - API_KEY=sk-production-key-exposed
      - DATABASE_PASSWORD=supersecret123
    ports:
      - "22:22"
      - "3000:3000"
      - "8080:8080"