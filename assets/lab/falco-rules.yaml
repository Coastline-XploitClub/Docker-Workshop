# Custom Falco rules for container security monitoring
- rule: Container Privilege Escalation
  desc: Detect privilege escalation in containers
  condition: >
    spawned_process and container and
    (proc.name in (sudo, su) or proc.args contains setuid)
  output: >
    Privilege escalation detected in container
    (command=%proc.cmdline container=%container.name user=%user.name)
  priority: WARNING

- rule: Sensitive File Access in Container
  desc: Detect access to sensitive files from container
  condition: >
    open_read and container and
    (fd.name in (/etc/shadow, /etc/passwd, /etc/sudoers) or
     fd.name startswith /proc/)
  output: >
    Sensitive file access from container
    (file=%fd.name container=%container.name command=%proc.cmdline)
  priority: ERROR

- rule: Container Escape Attempt
  desc: Detect potential container escape attempts
  condition: >
    spawned_process and container and
    (proc.name in (mount, umount, chroot, pivot_root) or
     proc.cmdline contains /proc/sys/kernel)
  output: >
    Potential container escape attempt
    (command=%proc.cmdline container=%container.name user=%user.name)
  priority: CRITICAL

- rule: Suspicious Network Activity
  desc: Detect suspicious network activity from containers
  condition: >
    (inbound_outbound) and container and
    (fd.net != "127.0.0.1" and fd.sport != 3000 and fd.dport != 3000) and
    not proc.name in (node, npm)
  output: >
    Suspicious network activity from container
    (connection=%fd.name container=%container.name command=%proc.cmdline)
  priority: WARNING