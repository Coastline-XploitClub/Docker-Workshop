scan:
  scanners: ["vuln", "secret", "misconfig"]
  severity: ["MEDIUM", "HIGH", "CRITICAL"]
vulnerability:
  ignore-unfixed: true
license:
  forbidden: ["GPL-3.0", "AGPL-3.0"]
secret:
  skip-files:
    - "*.md"
    - "*.txt"
    - "trivy.yaml"
misconfig:
  severity: ["MEDIUM", "HIGH", "CRITICAL"]
  include-non-failures: false